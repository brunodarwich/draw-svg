<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Telas do DrawSVG Studio</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #09090b; color: #f4f4f5; }
    main { max-width: 1500px; margin: 0 auto; padding: 32px 24px 64px; }
    header { display: flex; gap: 16px; align-items: center; margin-bottom: 28px; }
    header img { width: 56px; height: 56px; }
    h1 { margin: 0; font-size: clamp(24px, 3vw, 36px); }
    p { color: #a1a1aa; line-height: 1.5; margin: 7px 0 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 560px), 1fr)); gap: 22px; }
    figure { margin: 0; border: 1px solid #27272a; border-radius: 16px; background: #18181b; overflow: hidden; }
    figure a { display: block; }
    figure img { display: block; width: 100%; height: auto; }
    figcaption { padding: 15px 18px 18px; }
    figcaption strong { font-size: 16px; }
    figcaption p { font-size: 14px; }
    .note { margin-top: 26px; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="../../../public/assets/images/logo-preferred-icon.svg" alt="">
      <div><h1>Telas do DrawSVG Studio</h1><p>Conceitos visuais do Marco 2. Clique em uma imagem para abrir em tamanho integral.</p></div>
    </header>
    <div class="grid">
      <figure><a href="screen-01-studio-workspace.png"><img src="screen-01-studio-workspace.png" alt="Estúdio com prancheta branca e ferramentas de desenho"></a><figcaption><strong>01 · Studio Workspace</strong><p>Prancheta central, barra de ferramentas e navegação principal.</p></figcaption></figure>
      <figure><a href="screen-02-svg-inspector.png"><img src="screen-02-svg-inspector.png" alt="Estúdio com inspetor de código SVG aberto"></a><figcaption><strong>02 · Inspetor SVG</strong><p>Código ao vivo, cópia e exportação.</p></figcaption></figure>
      <figure><a href="screen-03-layers-panel.png"><img src="screen-03-layers-panel.png" alt="Estúdio com painel de camadas aberto"></a><figcaption><strong>03 · Camadas</strong><p>Ordem, visibilidade, bloqueio e opacidade.</p></figcaption></figure>
      <figure><a href="screen-04-gallery-drawer.png"><img src="screen-04-gallery-drawer.png" alt="Gaveta de galeria com seis artes"></a><figcaption><strong>04 · Galeria</strong><p>Miniaturas e ações sobre desenhos salvos.</p></figcaption></figure>
    </div>
    <p class="note">As imagens são propostas visuais. O conteúdo do código e as datas exibidas nos exemplos são ilustrativos.</p>
  </main>
</body>
</html>
